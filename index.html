<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanala | The Standard in Digital Trust</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- TANALA WHITE LUXURY THEME --- */
        :root {
            --text-primary: #022c22; 
            --text-secondary: #4b5563; 
            --accent-gold: #d97706; 
            --accent-green: #059669; 
            
            --glass-bg: rgba(255, 255, 255, 0.95); 
            --glass-border: rgba(255, 255, 255, 0.98);
            --glass-shadow: 0 40px 100px -12px rgba(0, 0, 0, 0.15), 0 30px 60px -30px rgba(0, 0, 0, 0.1);
            
            --input-border: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            margin: 0;
            overflow-x: hidden;
            background-color: #f3f4f6; 
            cursor: default; 
        }

        .font-luxury { font-family: 'Cinzel', serif; letter-spacing: 0.05em; } 
        .font-elegant { font-family: 'Cormorant Garamond', serif; } 
        .mono { font-family: 'JetBrains Mono', monospace; }

        .bg-image-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: ken-burns 30s ease-in-out infinite alternate;
        }

        @keyframes ken-burns {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .login-glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            border-radius: 32px;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .naked-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--input-border);
            border-radius: 0;
            padding: 16px 0 16px 32px; 
            width: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 15px;
            position: relative;
            font-family: 'Inter', sans-serif;
        }
        .naked-input:focus {
            outline: none;
            border-bottom: 2px solid var(--accent-green);
            background: linear-gradient(to top, rgba(16, 185, 129, 0.05), transparent);
            padding-left: 40px;
            letter-spacing: 0.02em;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .btn-shimmer {
            background: linear-gradient(90deg, #064e3b 0%, #10b981 50%, #064e3b 100%);
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }
        
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 200; animation: fall 3s linear forwards; }
        @keyframes fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        
        /* FIXED DOCK STYLES */
        .dock-container {
            position: fixed; bottom: 30px; left: 0; right: 0; margin: 0 auto; width: max-content;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.2);
            border-radius: 32px; padding: 10px 20px; display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 100;
        }

        .dock-item {
            position: relative; width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, #ffffff, #f0fdf4); display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--text-secondary); cursor: pointer; transition: all 0.3s;
        }
        .dock-item:hover { transform: scale(1.1) translateY(-5px); color: var(--accent-green); }
        .dock-item.danger:hover { color: #dc2626; }

        .dock-tooltip {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%) scale(0.8);
            background: rgba(0,0,0,0.8); color: white; padding: 3px 6px; border-radius: 4px;
            font-size: 9px; font-weight: bold; opacity: 0; transition: all 0.2s ease; pointer-events: none;
            font-family: 'Inter', sans-serif; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .dock-item:hover .dock-tooltip { opacity: 1; transform: translateX(-50%) scale(1); top: -35px; }
        
        .dock-item.active { border-color: var(--accent-green); color: var(--accent-green); }
        .dock-item.active::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-green); }

        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 30px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes shake-red { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .win-pulse { animation: pulse-green 1.5s infinite; }
        .loss-shake { animation: shake-red 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen">

    <div class="bg-image-layer"></div>
    <div id="root" class="min-h-screen flex items-center justify-center"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, getDocs, onSnapshot, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;
        
        // --- 🟢 YOUR PRE-FILLED CONFIG (DO NOT DELETE) ---
        const userFirebaseConfig = {
          apiKey: "AIzaSyBWwljBrgUrCNBJopPoOmmZEWAGI9x6KBo",
          authDomain: "tanala-betting-2345d.firebaseapp.com",
          projectId: "tanala-betting-2345d",
          storageBucket: "tanala-betting-2345d.firebasestorage.app",
          messagingSenderId: "542599851557",
          appId: "1:542599851557:web:9ba472ee6547371743d9cc"
        };
        // ---------------------------------------------------

        let db, auth;
        let appId = 'tanala-betting-v1';

        try {
            // Priority to user config for deployment
            let config = userFirebaseConfig; 
            
            // Fallback for Gemini internal preview only if user config is empty
            if ((!config || !config.apiKey) && typeof __firebase_config !== 'undefined') {
                config = JSON.parse(__firebase_config);
            }

            if (config && config.apiKey) {
                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);
                signInAnonymously(auth).catch(console.error);
            } else {
                console.warn("No Firebase Config Found. App will run in offline mode.");
            }
        } catch(e) { console.error("Firebase Setup Failed", e); }


        // --- DATA ---
        const generateRaceData = () => {
            const cities = ['mumbai', 'pune', 'calcutta', 'bangalore', 'delhi', 'mysore', 'hyderabad'];
            const data = {};
            cities.forEach(city => {
                data[city] = {};
                for (let r = 1; r <= 10; r++) {
                    const horses = [];
                    for (let h = 1; h <= 10; h++) {
                        const odds = (Math.random() * 10 + 1.5).toFixed(1);
                        horses.push({
                            id: `${city}-${r}-${h}`,
                            name: `${city.charAt(0).toUpperCase() + city.slice(1)} XYZ-${h}`,
                            jockey: `Jockey ${String.fromCharCode(65+h)}`,
                            odds: odds,
                            color: h % 2 === 0 ? 'bg-emerald-600' : 'bg-amber-600',
                            silk: h
                        });
                    }
                    data[city][r] = horses;
                }
            });
            return data;
        };
        const FULL_RACE_DATA = generateRaceData();

        // --- DB HELPER (CLOUD FIRESTORE) ---
        const DB = {
            // Retrieve user profile from Public Data (Allowing Admin to see it)
            getUser: async (username) => {
                if(!db) return null;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', username);
                try {
                    const snap = await getDoc(docRef);
                    return snap.exists() ? snap.data() : null;
                } catch(e) { console.error("Error getting user:", e); return null; }
            },
            // Create/Update User - ALWAYS MERGE WITH DEFAULT STRUCTURE
            saveUser: async (user) => {
                 const defaultUser = { 
                    ...user, 
                    balance: 5000, 
                    transactions: [],
                    joinedAt: Date.now(),
                    uniqueId: 'TAN-' + Math.random().toString(36).substr(2, 4).toUpperCase(),
                    ...user 
                 };

                 if(!db) return defaultUser;

                 // Sanitize username for path
                 const safeUsername = user.name.replace(/[^a-zA-Z0-9]/g, ''); 
                 const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', safeUsername);
                 
                 try {
                     const snap = await getDoc(docRef);
                     if (snap.exists()) {
                         const data = snap.data();
                         // Repair missing fields
                         if (data.balance === undefined || !data.transactions) {
                             const patched = { 
                                 ...data,
                                 balance: data.balance ?? 5000, 
                                 transactions: data.transactions ?? [] 
                             };
                             await setDoc(docRef, patched, { merge: true });
                             return patched;
                         }
                         return data; 
                     }
                     // Create new if doesn't exist
                     await setDoc(docRef, defaultUser);
                     return defaultUser;
                 } catch(e) {
                     console.error("Error saving user:", e);
                     return defaultUser;
                 }
            },
            // Add Transaction & Update Balance (SAFER SETDOC)
            addTransaction: async (username, tx) => {
                if(!db) return;
                const safeUsername = username.replace(/[^a-zA-Z0-9]/g, '');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', safeUsername);
                try {
                    await setDoc(docRef, {
                        balance: increment(tx.amount),
                        transactions: arrayUnion(tx)
                    }, { merge: true });
                } catch(e) {
                    console.error("Error adding tx:", e);
                }
            },
            // Submit Deposit Request
            submitDeposit: async (username, amount, utr) => {
                if(!db) return;
                const reqRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'requests'));
                await setDoc(reqRef, {
                     id: reqRef.id,
                     username,
                     amount,
                     utr,
                     status: 'PENDING',
                     timestamp: Date.now()
                });
            },
            // Approve Deposit
            approveDeposit: async (request) => {
                if(!db) return;
                const reqRef = doc(db, 'artifacts', appId, 'public', 'data', 'requests', request.id);
                await updateDoc(reqRef, { status: 'APPROVED' });
                
                const safeUsername = request.username.replace(/[^a-zA-Z0-9]/g, '');
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', safeUsername);
                await setDoc(userRef, {
                     balance: increment(request.amount),
                     transactions: arrayUnion({ type: 'DEPOSIT', amount: request.amount, desc: `Deposit UTR: ${request.utr}`, date: Date.now() })
                }, { merge: true });
            },
            // Reject Deposit
            rejectDeposit: async (requestId) => {
                 if(!db) return;
                 const reqRef = doc(db, 'artifacts', appId, 'public', 'data', 'requests', requestId);
                 await updateDoc(reqRef, { status: 'REJECTED' });
            },
            // Listen to Pending Requests
            listenToRequests: (callback) => {
                if(!db) return () => {};
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'requests'));
                return onSnapshot(q, (snap) => {
                    const reqs = [];
                    snap.forEach(d => {
                        const data = d.data();
                        if(data.status === 'PENDING') reqs.push(data);
                    });
                    callback(reqs);
                });
            },
            // Admin: Listen to ALL Users in Realtime (Live Dashboard)
            listenToAllUsers: (callback) => {
                if(!db) return () => {};
                try {
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                    return onSnapshot(q, (snapshot) => {
                        const users = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            if(data.uniqueId && data.role !== 'admin') users.push(data);
                        });
                        callback(users);
                    });
                } catch(e) { console.error(e); return () => {}; }
            },
            // Listen to current user (Realtime Balance)
            listenToUser: (username, callback) => {
                if(!db) return () => {};
                const safeUsername = username.replace(/[^a-zA-Z0-9]/g, '');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', safeUsername);
                return onSnapshot(docRef, (doc) => {
                    if (doc.exists()) callback(doc.data());
                });
            }
        };

        // --- COMPONENTS ---

        const Logo = ({ size = "md", onClick }) => {
            const dim = size === "lg" ? "w-28 h-28" : "w-20 h-20";
            return (
                <div onClick={onClick} className={`${dim} mx-auto relative flex items-center justify-center animate-float cursor-pointer z-50`}>
                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-xl">
                        <defs>
                            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#d97706" /><stop offset="100%" stopColor="#b45309" /></linearGradient>
                            <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#10b981" /><stop offset="100%" stopColor="#047857" /></linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="none" stroke="url(#gold)" strokeWidth="1.5" opacity="0.8" />
                        <circle cx="50" cy="50" r="45" fill="white" fillOpacity="0.95" />
                        <path d="M50 15 L80 35 L80 65 Q50 90 20 65 L20 35 Z" fill="none" stroke="url(#green)" strokeWidth="3" />
                        <text x="50" y="65" textAnchor="middle" fill="url(#gold)" fontFamily="Cinzel, serif" fontSize="36" fontWeight="bold">TA</text>
                    </svg>
                </div>
            );
        };

        const ConfettiExplosion = () => {
            const particles = Array.from({ length: 50 }).map((_, i) => ({
                id: i, left: Math.random() * 100 + 'vw', delay: Math.random() * 2 + 's', bg: ['#10b981', '#fbbf24', '#ffffff'][Math.floor(Math.random() * 3)]
            }));
            return <div className="fixed inset-0 pointer-events-none z-[200]">{particles.map(p => (<div key={p.id} className="confetti" style={{ left: p.left, animationDelay: p.delay, backgroundColor: p.bg }}></div>))}</div>;
        };

        const MenuDrawer = ({ isOpen, onClose, user, onLogout, onViewWallet, onOpenAdmin }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="menu-drawer relative w-72 h-full bg-white shadow-2xl p-6 flex flex-col justify-between border-r border-[var(--glass-border)] text-[var(--text-primary)]">
                        <div>
                            <div className="flex items-center gap-3 mb-8"><Logo size="md" /><div><h2 className="font-luxury font-bold text-xl">Tanala</h2><p className="text-[10px] uppercase tracking-widest opacity-60">Menu</p></div></div>
                            <nav className="space-y-2">
                                <button onClick={onViewWallet} className="w-full text-left p-3 rounded-xl hover:bg-[var(--glass-bg)] flex items-center gap-3 transition-colors"><i className="ph-bold ph-wallet text-xl text-[var(--accent-gold)]"></i><span className="font-bold">My Wallet</span></button>
                                <button className="w-full text-left p-3 rounded-xl hover:bg-[var(--glass-bg)] flex items-center gap-3 transition-colors opacity-50 cursor-not-allowed"><i className="ph-bold ph-user-gear text-xl"></i><span className="font-bold">Profile Settings</span></button>
                                
                                {/* ADMIN BUTTON - ONLY VISIBLE TO ADMIN */}
                                {user.role === 'admin' && (
                                    <button onClick={onOpenAdmin} className="w-full text-left p-4 rounded-xl bg-gradient-to-r from-gray-900 to-black text-white flex items-center gap-3 transition-all mt-6 shadow-xl border border-gray-700 group"><div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-emerald-500 transition-colors"><i className="ph-bold ph-shield-check text-lg"></i></div><div><span className="font-bold block text-sm">Admin Command</span><span className="text-[10px] text-gray-400 uppercase tracking-wider">Restricted Access</span></div></button>
                                )}
                            </nav>
                        </div>
                        <button onClick={onLogout} className="w-full py-3 rounded-xl border border-red-500/30 text-red-500 hover:bg-red-500/10 font-bold flex items-center justify-center gap-2"><i className="ph-bold ph-sign-out"></i> Log Out</button>
                    </div>
                </div>
            );
        };

        // --- ADMIN DASHBOARD OVERLAY ---
        const AdminDashboard = ({ onClose, onLogout }) => {
            const [stats, setStats] = useState({ totalRevenue: 0, totalPayouts: 0, netProfit: 0, userCount: 0 });
            const [allUsers, setAllUsers] = useState([]);
            const [pendingRequests, setPendingRequests] = useState([]);
            const [activeView, setActiveView] = useState('users'); 
            const [selectedUser, setSelectedUser] = useState(null);
            
            // LOAD DATA EFFECT
            useEffect(() => {
                const unsubscribeUsers = DB.listenToAllUsers((users) => {
                    setAllUsers(users);
                    let rev = 0, pay = 0;
                    users.forEach(u => {
                        if(u.transactions) {
                             u.transactions.forEach(tx => {
                                 if(tx.type === 'BET') rev += Math.abs(tx.amount);
                                 if(tx.type === 'WIN') pay += tx.amount;
                             });
                        }
                    });
                    setStats({ totalRevenue: rev, totalPayouts: pay, netProfit: rev - pay, userCount: users.length });
                });
                const unsubscribeRequests = DB.listenToRequests((reqs) => { setPendingRequests(reqs); });
                return () => { unsubscribeUsers(); unsubscribeRequests(); }
            }, []);

            return (
                <div className="fixed inset-0 z-[150] bg-gray-100/90 backdrop-blur-md overflow-y-auto animate-enter">
                    <div className="p-6 pb-20 max-w-5xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                             <div><h1 className="text-3xl font-luxury font-bold text-emerald-900">Admin Command</h1><p className="text-xs text-gray-500 font-bold uppercase tracking-widest flex items-center gap-2">Master Control Panel <span className="flex h-2 w-2 relative"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span></p></div>
                             <button onClick={onClose} className="w-10 h-10 bg-white shadow-md rounded-full flex items-center justify-center hover:bg-red-50 hover:text-red-500"><i className="ph-bold ph-x text-xl"></i></button>
                        </div>
                        <div className="flex gap-4 mb-6">
                            <button onClick={() => setActiveView('users')} className={`px-6 py-3 rounded-xl font-bold uppercase text-xs tracking-widest ${activeView === 'users' ? 'bg-emerald-900 text-white shadow-lg' : 'bg-white text-gray-500'}`}>User Database</button>
                            <button onClick={() => setActiveView('deposits')} className={`px-6 py-3 rounded-xl font-bold uppercase text-xs tracking-widest relative ${activeView === 'deposits' ? 'bg-emerald-900 text-white shadow-lg' : 'bg-white text-gray-500'}`}>Deposit Requests {pendingRequests.length > 0 && <span className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full flex items-center justify-center text-[10px]">{pendingRequests.length}</span>}</button>
                        </div>
                        {activeView === 'users' && (<div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"><div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Total Revenue</div><div className="text-3xl font-mono font-bold text-emerald-600">₹{stats.totalRevenue.toLocaleString()}</div></div><div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Total Payouts</div><div className="text-3xl font-mono font-bold text-red-500">₹{stats.totalPayouts.toLocaleString()}</div></div><div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Net Profit</div><div className={`text-3xl font-mono font-bold ${stats.netProfit >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>{stats.netProfit >= 0 ? '+' : ''}₹{stats.netProfit.toLocaleString()}</div></div><div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Active Users</div><div className="text-3xl font-mono font-bold text-blue-600">{stats.userCount}</div></div></div>)}
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 overflow-hidden min-h-[400px]">
                            {activeView === 'users' ? (<div className="overflow-x-auto"><table className="w-full text-left"><thead className="text-[10px] uppercase text-gray-400 border-b border-gray-200"><tr><th className="pb-3 pl-2">User ID</th><th className="pb-3">Username</th><th className="pb-3">Balance</th><th className="pb-3 text-right pr-2">Actions</th></tr></thead><tbody className="text-sm">{allUsers.map(user => (<tr key={user.uniqueId} className="border-b border-gray-50 last:border-0 hover:bg-gray-50/50 transition-colors"><td className="py-4 pl-2 font-mono text-gray-500">{user.uniqueId}</td><td className="py-4 font-bold text-gray-800">{user.name}</td><td className="py-4 font-mono font-bold text-emerald-600">₹{(user.balance || 0).toLocaleString()}</td><td className="py-4 text-right pr-2"><button onClick={() => setSelectedUser(user)} className="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100">View</button></td></tr>))}</tbody></table></div>) : (<div><h3 className="font-luxury font-bold mb-4">Pending Approvals</h3>{pendingRequests.length === 0 ? (<div className="text-center text-gray-400 py-10">No pending deposit requests.</div>) : (<div className="space-y-3">{pendingRequests.map(req => (<div key={req.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-200"><div><div className="font-bold text-lg text-gray-900">₹{req.amount}</div><div className="text-xs text-gray-500">User: <span className="font-bold text-gray-700">{req.username}</span></div><div className="text-xs text-gray-500 font-mono mt-1">UTR: {req.utr}</div></div><div className="flex gap-2"><button onClick={() => DB.approveDeposit(req)} className="px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold text-xs hover:bg-emerald-600 shadow-lg shadow-emerald-200">Approve</button><button onClick={() => DB.rejectDeposit(req.id)} className="px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold text-xs hover:bg-red-200">Reject</button></div></div>))}</div>)}</div>)}
                        </div>
                        {selectedUser && (<div className="fixed inset-0 z-[250] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"><div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-enter"><div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50"><div><h3 className="font-bold text-lg">{selectedUser.name}</h3><div className="font-mono text-xs text-gray-400">{selectedUser.uniqueId}</div></div><button onClick={() => setSelectedUser(null)} className="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors"><i className="ph-bold ph-x"></i></button></div><div className="p-6 max-h-[60vh] overflow-y-auto"><div className="space-y-2">{selectedUser.transactions && selectedUser.transactions.length > 0 ? (selectedUser.transactions.map((tx, i) => (<div key={i} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100"><div><div className="font-bold text-xs">{tx.desc}</div><div className="text-[10px] text-gray-400">{new Date(tx.date).toLocaleString()}</div></div><div className={`font-mono font-bold text-sm ${tx.amount > 0 ? 'text-emerald-600' : 'text-red-500'}`}>{tx.amount > 0 ? '+' : ''}{tx.amount}</div></div>))) : (<div className="text-center text-gray-400 py-4 text-sm">No transaction history found.</div>)}</div></div></div></div>)}
                    </div>
                </div>

        };

        const WalletView = ({ user, onClose, defaultTab = 'balance' }) => {
            const [activeTab, setActiveTab] = useState(defaultTab);
            const [localUser, setLocalUser] = useState(user);
            const [depositAmount, setDepositAmount] = useState('');
            const [utrNumber, setUtrNumber] = useState('');

            useEffect(() => {
                if (user.role === 'admin') return; 
                const unsubscribe = DB.listenToUser(user.name, (updatedData) => { if (updatedData) setLocalUser(updatedData); });
                return () => unsubscribe();
            }, [user.name]);

            const handleSubmitDeposit = async () => {
                 if(!depositAmount || !utrNumber) { alert("Please enter both amount and UTR number"); return; }
                 await DB.submitDeposit(user.name, parseFloat(depositAmount), utrNumber);
                 alert("Deposit Request Submitted! Admin will verify shortly.");
                 setDepositAmount(''); setUtrNumber('');
            };

            const displayUser = localUser || user;

            return (
                <div className="fixed inset-0 z-[90] flex items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-enter">
                    <div className="glass-panel w-full max-w-md p-0 rounded-3xl relative bg-white overflow-hidden shadow-2xl h-[650px] flex flex-col">
                        <div className="p-6 pb-2">
                            <div className="flex justify-between items-center mb-4"><h2 className="text-2xl font-luxury font-bold">My Wallet</h2><button onClick={onClose} className="w-10 h-10 bg-gray-100 hover:bg-red-500 hover:text-white rounded-full flex items-center justify-center transition-all shadow-md"><i className="ph-bold ph-x text-xl"></i></button></div>
                            <div className="black-card p-6 mb-6"><div className="flex justify-between items-start mb-8"><div className="text-amber-500 font-luxury font-bold tracking-widest text-sm">TANALA ELITE</div><i className="ph-fill ph-wifi-high text-white/50"></i></div><div className="text-3xl font-mono font-bold tracking-wider text-white">₹{(displayUser.balance || 0).toLocaleString()}</div><div className="flex justify-between items-end mt-4"><div className="text-[10px] text-white/60 uppercase tracking-widest">Available Balance</div><div className="font-mono text-sm text-white/80 tracking-widest">{displayUser.uniqueId}</div></div></div>
                            <div className="flex p-1 bg-gray-100 rounded-xl">{['balance', 'deposit', 'withdraw', 'history'].map(tab => (<button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-2 rounded-lg text-xs font-bold uppercase tracking-wide transition-all ${activeTab === tab ? 'bg-white shadow text-emerald-800' : 'text-gray-400 hover:text-gray-600'}`}>{tab === 'balance' ? 'Main' : tab}</button>))}</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 pt-0 no-scrollbar">
                            {activeTab === 'balance' && (<div className="space-y-3 mt-4 animate-enter"><button onClick={() => setActiveTab('deposit')} className="w-full p-4 rounded-xl bg-emerald-50 border border-emerald-100 flex items-center justify-between hover:bg-emerald-100 transition-colors group"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white"><i className="ph-bold ph-arrow-down"></i></div><div className="text-left"><div className="font-bold text-emerald-900">Add Funds</div><div className="text-[10px] text-emerald-700">UPI / QR / Bank</div></div></div><i className="ph-bold ph-caret-right text-emerald-400 group-hover:translate-x-1 transition-transform"></i></button><button onClick={() => setActiveTab('withdraw')} className="w-full p-4 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-between hover:bg-gray-100 transition-colors group"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white"><i className="ph-bold ph-arrow-up"></i></div><div className="text-left"><div className="font-bold text-gray-900">Withdraw</div><div className="text-[10px] text-gray-500">To Bank Account</div></div></div><i className="ph-bold ph-caret-right text-gray-400 group-hover:translate-x-1 transition-transform"></i></button></div>)}
                            {activeTab === 'deposit' && (<div className="animate-enter mt-2 text-center"><p className="text-xs text-gray-500 mb-6 font-elegant">Scan to pay instantly</p><div className="inline-block p-2 bg-white rounded-2xl shadow-lg border border-gray-100 mb-6"><img src="WhatsApp%20Image%202026-01-28%20at%202.29.15%20PM.jpeg" alt="QR" className="rounded-xl w-48 h-48 object-cover mx-auto" onError={(e) => { e.target.onerror = null; e.target.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=bijugeorge-mail.com@okhdfcbank"; }} /></div><div className="bg-gray-50 p-3 rounded-xl flex items-center justify-between border border-gray-200 mb-6"><span className="font-mono text-sm text-gray-600">bijugeorge-mail.com@okhdfcbank</span><button className="text-xs font-bold text-emerald-600 uppercase">Copy</button></div><div className="space-y-3 text-left"><label className="text-[10px] font-bold uppercase text-gray-400">Amount Paid</label><input type="number" value={depositAmount} onChange={(e) => setDepositAmount(e.target.value)} className="naked-input bg-gray-50 rounded-lg" placeholder="5000" /><label className="text-[10px] font-bold uppercase text-gray-400">UTR / Ref No.</label><input type="text" value={utrNumber} onChange={(e) => setUtrNumber(e.target.value)} className="naked-input bg-gray-50 rounded-lg" placeholder="1234567890" /></div><button onClick={handleSubmitDeposit} className="w-full mt-6 py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg font-luxury">Submit Request</button></div>)}
                            {activeTab === 'withdraw' && (<div className="animate-enter mt-4 space-y-4"><div><label className="text-[10px] font-bold uppercase text-gray-400">Withdraw Amount</label><input type="number" className="naked-input bg-gray-50 rounded-lg text-2xl font-mono" placeholder="0.00" /><div className="text-right text-[10px] text-gray-400 mt-1">Max: ₹{(displayUser.balance || 0)}</div></div><div><label className="text-[10px] font-bold uppercase text-gray-400">UPI ID / Bank Acct</label><input type="text" className="naked-input bg-gray-50 rounded-lg" placeholder="user@upi" /></div><div className="p-3 bg-amber-50 text-amber-800 text-xs rounded-lg border border-amber-100 font-elegant"><i className="ph-bold ph-info mr-1"></i> Withdrawals are processed within 24 hours.</div><button className="w-full py-4 bg-gray-900 text-white font-bold rounded-xl shadow-lg font-luxury">Request Payout</button></div>)}
                            {activeTab === 'history' && (<div className="animate-enter mt-2 space-y-3">{(displayUser.transactions && displayUser.transactions.length > 0) ? (displayUser.transactions.map((tx, i) => (<div key={i} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100 hover:bg-white hover:shadow-sm transition-all"><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center text-white ${tx.type === 'WIN' ? 'bg-emerald-500' : (tx.type === 'BET' ? 'bg-gray-800' : 'bg-blue-500')}`}><i className={`ph-bold ${tx.type === 'WIN' ? 'ph-trophy' : (tx.type === 'BET' ? 'ph-receipt' : 'ph-wallet')}`}></i></div><div><div className="font-bold text-sm text-gray-800">{tx.desc}</div><div className="text-[10px] text-gray-400 font-mono">{new Date(tx.date).toLocaleDateString()} • {new Date(tx.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div></div></div><div className="text-right"><div className={`font-mono font-bold ${tx.amount > 0 ? 'text-emerald-600' : 'text-gray-900'}`}>{tx.amount > 0 ? '+' : ''}{tx.amount.toLocaleString()}</div><div className={`text-[9px] font-bold uppercase ${tx.type === 'WIN' ? 'text-emerald-500' : 'text-gray-400'}`}>{tx.type}</div></div></div>))) : (<div className="flex flex-col items-center justify-center py-10 opacity-50"><i className="ph-duotone ph-receipt text-4xl mb-2 text-gray-400"></i><div className="text-sm font-elegant text-gray-500">No transactions found</div></div>)}</div>)}
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ onLoginSuccess, onAdminAccess }) => {
            const [view, setView] = useState('login'); 
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [rotation, setRotation] = useState({ x: 0, y: 0 });
            const [formData, setFormData] = useState({ name: '', password: '', dob: '' });

            const handleMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                setRotation({ x: ((y - centerY) / centerY) * -12, y: ((x - centerX) / centerX) * 12 });
                setMousePos({ x, y });
            };

            const handleChange = (e) => { setFormData({ ...formData, [e.target.name]: e.target.value }); setError(''); };

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true); 
                setError('');
                
                try {
                    // ADMIN CHECK
                    if (formData.name === 'biju' && formData.password === 'biju123') { 
                        onLoginSuccess({ name: "Administrator", uniqueId: "ADMIN-MASTER", balance: 9999999, role: 'admin' });
                        setIsLoading(false);
                        return; 
                    }

                    if (view === 'login') {
                        const safeName = formData.name.replace(/[^a-zA-Z0-9]/g, '');
                        const existingUser = await DB.getUser(safeName);
                        
                        if (existingUser && existingUser.password === formData.password) {
                             onLoginSuccess(existingUser);
                        } else {
                            setError("Invalid Credentials or User Not Found");
                        }
                    } else {
                        if (!formData.name || !formData.password) { setError("Fields required"); setIsLoading(false); return; }
                        const safeName = formData.name.replace(/[^a-zA-Z0-9]/g, '');
                        const existing = await DB.getUser(safeName);
                        if (existing) {
                            setError("Username already taken.");
                        } else {
                            const userToSave = {...formData, name: safeName};
                            const newUser = await DB.saveUser(userToSave);
                            alert(`Welcome ${newUser.name}!`);
                            onLoginSuccess(newUser);
                        }
                    }
                } catch(err) {
                    console.error(err);
                    setError("Network Error. Try again.");
                }
                setIsLoading(false);
            };

            return (
                <div className="perspective-1000 w-full flex justify-center p-4">
                    <div className="login-glass-card w-full max-w-[440px] rounded-[40px] overflow-hidden animate-enter relative transition-transform duration-100 ease-out" onMouseMove={handleMouseMove} onMouseLeave={() => setRotation({ x: 0, y: 0 })} style={{ transform: `perspective(1000px) rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)` }}>
                        <div className="absolute inset-0 pointer-events-none z-0" style={{ background: `radial-gradient(600px circle at ${mousePos.x}px ${mousePos.y}px, rgba(255, 255, 255, 0.4), transparent 40%)` }}></div>
                        <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-500 via-yellow-400 to-emerald-500 z-10"></div>
                        <div className="p-10 md:p-12 relative z-10">
                            <div className="text-center mb-10 animate-enter delay-100"><Logo size="md" /><h1 className="text-4xl font-luxury font-bold mt-4 text-[#022c22] tracking-tight">Tanala</h1><p className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-600 mt-2 font-luxury">Premium Betting</p></div>
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <div className="relative group animate-enter delay-200"><i className="ph ph-user absolute left-0 top-4 text-emerald-800/50 text-lg group-focus-within:text-emerald-800 transition-colors duration-300"></i><input type="text" name="name" placeholder="Username / Handle" className="naked-input" value={formData.name} onChange={handleChange} /></div>
                                {view === 'signup' && (<div className="relative group animate-enter delay-200"><i className="ph ph-calendar absolute left-0 top-4 text-emerald-800/50 text-lg group-focus-within:text-emerald-800 transition-colors duration-300"></i><input type="date" name="dob" className="naked-input text-emerald-800" value={formData.dob} onChange={handleChange} /></div>)}
                                <div className="relative group animate-enter delay-300"><i className="ph ph-lock-key absolute left-0 top-4 text-emerald-800/50 text-lg group-focus-within:text-emerald-800 transition-colors duration-300"></i><input type="password" name="password" placeholder="Password" className="naked-input" value={formData.password} onChange={handleChange} /></div>
                                {error && <div className="text-red-600 text-xs font-bold text-center animate-pulse bg-red-100 p-2 rounded">{error}</div>}
                                <div className="animate-enter delay-400"><button type="submit" disabled={isLoading} className="w-full py-4 mt-6 btn-shimmer text-white font-bold text-xs uppercase tracking-widest rounded-xl shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 relative overflow-hidden group font-luxury">{isLoading ? <i className="ph ph-spinner animate-spin text-xl"></i> : <><span className="relative z-10">{view === 'login' ? 'Enter' : 'Create Identity'}</span><i className="ph-bold ph-arrow-right relative z-10 group-hover:translate-x-1 transition-transform"></i></>}</button></div>
                            </form>
                            <div className="mt-8 text-center animate-enter delay-500">{view === 'login' ? (<p className="text-xs text-gray-500 font-medium font-elegant">New Member? <button onClick={() => { setView('signup'); setError(''); }} className="ml-2 font-bold text-amber-600 hover:text-amber-700 underline underline-offset-4 transition-colors">Join Club</button></p>) : (<p className="text-xs text-gray-500 font-medium font-elegant">Already a member? <button onClick={() => { setView('login'); setError(''); }} className="ml-2 font-bold text-emerald-800 hover:text-emerald-950 underline underline-offset-4 transition-colors">Log In</button></p>)}</div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD COMPONENTS ---
        const StadiumSelector = ({ selected, onSelect }) => {
            const cities = [{ id: 'mumbai', name: 'Mumbai', img: 'stadium_mumbai.jpg' }, { id: 'pune', name: 'Pune', img: 'stadium_pune.jpg' }, { id: 'calcutta', name: 'Calcutta', img: 'stadium_calcutta.jpg' }, { id: 'bangalore', name: 'Bangalore', img: 'stadium_bangalore.jpg' }, { id: 'delhi', name: 'Delhi', img: 'stadium_delhi.jpg' }, { id: 'mysore', name: 'Mysore', img: 'stadium_mysore.jpg' }, { id: 'hyderabad', name: 'Hyderabad', img: 'stadium_hyd.jpg' }];
            return (
                <div className="mt-6 px-4 overflow-x-auto no-scrollbar pb-4 animate-enter delay-100">
                    <div className="flex gap-4">
                        {cities.map((city) => (
                            <div key={city.id} onClick={() => onSelect(city)} className={`bento-card relative min-w-[100px] h-[100px] rounded-2xl overflow-hidden cursor-pointer ${selected.id === city.id ? 'ring-2 ring-emerald-500 shadow-xl scale-105' : 'opacity-80 grayscale hover:grayscale-0 hover:opacity-100 hover:scale-105'}`}>
                                <div className="absolute inset-0 bg-gradient-to-br from-emerald-900 to-slate-900 z-0"></div><img src={city.img} alt={city.name} className="absolute inset-0 w-full h-full object-cover z-10" onError={(e) => e.target.style.display = 'none'} /><div className="absolute inset-0 bg-black/30 hover:bg-black/10 transition-colors z-20 flex items-center justify-center"><span className="text-white font-luxury font-bold text-xs drop-shadow-md">{city.name}</span></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const HorseCard = ({ horse, onClick, delay }) => {
            return (
                <div onClick={() => onClick(horse)} className={`bento-card glass-panel p-4 rounded-xl flex items-center justify-between cursor-pointer hover:bg-white/95 relative overflow-hidden group border border-white/50 animate-enter ${delay}`}>
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/60 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 pointer-events-none"></div>
                    <div className="flex items-center gap-4 relative z-10"><div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl shadow-md ${horse.color}`}>{horse.silk}</div><div><h4 className="font-bold text-[#022c22] text-lg leading-tight group-hover:text-emerald-700 transition-colors font-luxury">{horse.name}</h4><div className="text-[10px] font-bold text-emerald-600 mt-1 uppercase tracking-wide font-mono">Jockey: {horse.jockey}</div></div></div>
                    <div className="flex flex-col items-end relative z-10"><div className="bg-amber-50 border border-amber-200 px-3 py-1 rounded-lg"><span className="font-mono font-black text-xl text-amber-700">{horse.odds}x</span></div><span className="text-[9px] text-emerald-800/60 font-bold mt-1 uppercase">Odds</span></div>
                </div>
            );
        };

        const LiveRace = ({ bet, onFinish, onClose, horses }) => {
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState("GATES_OPEN"); 
            const [winner, setWinner] = useState(null);
            useEffect(() => {
                let p = 0;
                const interval = setInterval(() => {
                    p += Math.random() * 2; 
                    if (p >= 100) {
                        p = 100;
                        clearInterval(interval);
                        setStatus("FINISH");
                        const isWin = Math.random() > 0.5; 
                        const winHorse = isWin ? bet.horse : horses.find(h => h.id !== bet.horse.id);
                        setWinner(winHorse);
                        setTimeout(() => setStatus("RESULT"), 1000);
                    }
                    setProgress(p);
                }, 100);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center text-white">
                    {status === "RESULT" && winner?.id === bet.horse.id && <ConfettiExplosion />}
                    <div className="absolute top-8 w-full flex justify-between px-8 z-50"><div className="flex items-center gap-2"><div className="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div><span className="font-mono text-sm tracking-widest text-emerald-500">LIVE FEED</span></div><div className="flex items-center gap-4"><div className="font-serif italic text-white/50 hidden sm:block">Derby Live • 1600m</div><button onClick={onClose} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md flex items-center justify-center transition-all text-white" title="Close & Return to Dashboard"><i className="ph-bold ph-x"></i></button></div></div>
                    <div className="w-full max-w-4xl px-4 relative z-10">
                        <div className="relative aspect-video rounded-3xl overflow-hidden shadow-2xl border-4 border-gray-900 bg-black">
                            <div className="absolute top-4 left-4 z-20 bg-red-600 text-white px-3 py-1 text-xs font-bold rounded flex items-center gap-2 animate-pulse"><div className="w-2 h-2 bg-white rounded-full"></div> LIVE</div>
                            <div className="absolute inset-0 flex items-center justify-center"><div className="absolute inset-0 bg-gray-900 flex flex-col items-center justify-center text-white"><i className="ph-fill ph-video-camera-slash text-6xl opacity-50 mb-4"></i><h3 className="text-xl font-bold tracking-widest">LIVE SIGNAL CONNECTING...</h3><p className="text-xs text-gray-500 mt-2">Race in Progress</p></div></div>
                            <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none"><a href="https://t.me/tanala_official" target="_blank" className="pointer-events-auto bg-blue-500 hover:bg-blue-600 text-white px-8 py-4 rounded-full font-bold shadow-lg flex items-center gap-3 transition-transform hover:scale-105"><i className="ph-bold ph-telegram-logo text-2xl"></i>Watch Live Stream</a></div>
                        </div>
                        <div className="mt-6 text-center text-white space-y-2"><h2 className="text-3xl font-black font-luxury italic tracking-wider">RACE IN PROGRESS</h2><p className="text-emerald-400 font-mono text-sm uppercase tracking-widest">Your Pick: {bet.horse.name}</p></div>
                    </div>
                    {status === "RESULT" && (
                        <div className="absolute inset-0 z-50 bg-black/80 flex flex-col items-center justify-center animate-enter">
                            <h1 className="text-6xl font-luxury font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400">{winner.name}</h1>
                            <p className="text-xl text-white/60 font-serif italic mb-10">Winner</p>
                            {winner.id === bet.horse.id ? (<div className="win-pulse bg-emerald-600 text-white p-10 rounded-3xl mb-8 transform hover:scale-105 transition-transform shadow-2xl border border-emerald-400 relative overflow-hidden"><div className="absolute inset-0 bg-gradient-to-b from-transparent to-black/20"></div><div className="relative z-10"><h2 className="text-4xl font-black font-luxury mb-2 tracking-widest">YOU WON</h2><div className="text-xs font-bold uppercase tracking-widest mb-1 opacity-80">Total Payout</div><div className="text-6xl font-mono font-bold">₹{(bet.amount * bet.horse.odds).toFixed(2)}</div></div></div>) : (<div className="loss-shake bg-gradient-to-br from-red-900 to-gray-900 border border-red-500/50 p-10 rounded-3xl mb-8 shadow-2xl relative overflow-hidden"><div className="absolute top-0 left-0 w-full h-1 bg-red-600"></div><div className="relative z-10"><h2 className="text-3xl font-black font-luxury mb-2 tracking-widest text-red-500">BETTER LUCK NEXT TIME</h2><div className="text-xs font-bold uppercase tracking-widest mb-1 text-gray-400">You Lost</div><div className="text-5xl font-mono font-bold text-white">₹{bet.amount}</div></div></div>)}
                            <button onClick={() => onFinish(winner.id === bet.horse.id ? (bet.amount * bet.horse.odds) : 0, winner.name)} className="px-10 py-4 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition-all uppercase tracking-widest text-xs font-luxury shadow-lg">Continue to Dashboard</button>
                        </div>
                    )}
                </div>
            );
        };

        const BetSlip = ({ horse, wallet, onClose, onPlaceBet }) => {
            const [stake, setStake] = useState('');
            const returnAmt = stake ? (parseFloat(stake) * horse.odds).toFixed(2) : '0.00';
            return (
                <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-enter">
                    <div className="glass-panel w-full max-w-sm rounded-3xl p-0 bg-white overflow-hidden shadow-2xl">
                        <div className="bg-emerald-900 p-6 text-white relative">
                            <button onClick={onClose} className="absolute top-4 right-4 text-white/50 hover:text-white"><i className="ph-bold ph-x text-xl"></i></button>
                            <div className="text-[10px] font-bold uppercase tracking-widest text-emerald-400 mb-1 font-luxury">Place Your Bet</div>
                            <h2 className="text-2xl font-luxury font-bold">{horse.name}</h2>
                            <div className="mt-2 inline-block bg-white/10 px-3 py-1 rounded text-xs font-mono font-bold">Odds: {horse.odds}</div>
                        </div>
                        <div className="p-6">
                            <div className="space-y-4 mb-8">
                                <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-luxury">Stake Amount (₹)</label><input type="number" value={stake} onChange={(e) => setStake(e.target.value)} placeholder="500" autoFocus className="w-full mt-2 p-4 bg-gray-50 border border-gray-200 rounded-xl font-mono text-2xl font-bold outline-none focus:border-emerald-500 focus:bg-white transition-all text-emerald-900 placeholder:text-gray-300" /><div className="text-right mt-1 text-[10px] text-gray-400 font-bold uppercase">Balance: ₹{wallet}</div></div>
                                <div className="flex justify-between items-center p-4 bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl border border-amber-100"><span className="text-[10px] font-bold text-amber-800 uppercase tracking-widest font-luxury">Potential Return</span><span className="font-mono font-bold text-2xl text-amber-600">₹{returnAmt}</span></div>
                            </div>
                            <button onClick={() => onPlaceBet(parseFloat(stake))} disabled={!stake || parseFloat(stake) > wallet} className="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-[0.98] uppercase tracking-widest text-xs flex items-center justify-center gap-2 font-luxury">Confirm Wager <i className="ph-bold ph-arrow-right"></i></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, wallet, handleLogout, toggleMenu, openWallet, openHistory }) => {
            const [activeModal, setActiveModal] = useState(null); 
            const [selectedHorse, setSelectedHorse] = useState(null);
            const [activeBet, setActiveBet] = useState(null);
            const [currentWallet, setCurrentWallet] = useState(wallet || 0); // Safety fallback
            const [activeCity, setActiveCity] = useState({ id: 'mumbai', name: 'Mumbai', img: 'stadium_mumbai.jpg' });
            const [activeRaceNum, setActiveRaceNum] = useState(1);
            const currentHorses = useMemo(() => { const cityData = FULL_RACE_DATA[activeCity.id]; return cityData ? cityData[activeRaceNum] : []; }, [activeCity, activeRaceNum]);

            // Real-time balance listener for dashboard
            useEffect(() => {
                if (user.role === 'admin') return;
                const unsubscribe = DB.listenToUser(user.name, (data) => {
                    if (data && data.balance !== undefined) setCurrentWallet(data.balance);
                });
                return () => unsubscribe();
            }, [user.name]);

            const isLowBalance = currentWallet < 500;

            const handlePlaceBet = async (amount) => {
                try {
                    const newBalance = currentWallet - amount;
                    setCurrentWallet(newBalance); // Optimistic update
                    
                    // Cloud Update
                    await DB.addTransaction(user.name, { type: 'BET', amount: -amount, desc: `Bet on ${selectedHorse.name}`, date: Date.now() });
                    
                    setActiveModal(null);
                    setActiveBet({ horse: selectedHorse, amount: amount });
                } catch (error) {
                    alert("Failed to place bet. Please check your connection.");
                    console.error(error);
                }
            };

            const handleRaceFinish = async (winnings, winnerName) => {
                if (winnings > 0) {
                    const newBalance = currentWallet + winnings;
                    setCurrentWallet(newBalance);
                    await DB.addTransaction(user.name, { type: 'WIN', amount: winnings, desc: `Won on ${winnerName}`, date: Date.now() });
                }
                setActiveBet(null);
                setSelectedHorse(null);
            };

            if (activeBet) return <LiveRace bet={activeBet} onFinish={handleRaceFinish} onClose={() => setActiveBet(null)} horses={currentHorses} />; // Passed onClose here

            return (
                <div className="pb-28">
                    {/* Header */}
                    <div className="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm backdrop-blur-md animate-enter">
                        <div className="flex items-center gap-3"><Logo size="sm" onClick={toggleMenu} /><div><div className="text-[10px] uppercase font-bold text-emerald-800 tracking-widest">Username</div><div className="font-mono font-bold text-sm text-[#022c22]">{user.name}</div></div></div>
                        <div className="flex flex-col items-end"><div className="text-[10px] uppercase font-bold text-emerald-800 tracking-widest">Balance</div><div className="font-mono font-bold text-xl text-emerald-600">₹{currentWallet.toLocaleString()}</div></div>
                    </div>

                    {/* Low Balance Warning */}
                    {isLowBalance && (
                        <div className="bg-red-600 text-white px-4 py-3 flex items-center justify-between shadow-lg z-40 relative animate-enter">
                            <div className="flex items-center gap-2">
                                 <i className="ph-fill ph-warning-circle text-xl"></i>
                                 <div>
                                     <div className="font-bold text-xs uppercase tracking-wider">Low Balance</div>
                                     <div className="text-[10px] opacity-80">Minimum ₹500 required to bet.</div>
                                 </div>
                            </div>
                            <button onClick={openWallet} className="bg-white text-red-600 px-3 py-1 rounded-lg text-[10px] font-bold uppercase">Deposit</button>
                        </div>
                    )}

                    <StadiumSelector selected={activeCity} onSelect={(city) => { setActiveCity(city); setActiveRaceNum(1); }} />
                    <div className="px-6 mt-4 overflow-x-auto no-scrollbar pb-2 animate-enter delay-200"><div className="flex gap-2">{Array.from({length: 10}, (_, i) => i + 1).map(num => (<button key={num} onClick={() => setActiveRaceNum(num)} className={`px-4 py-2 rounded-lg text-xs font-bold uppercase transition-all shadow-sm ${activeRaceNum === num ? 'race-badge-active scale-105' : 'race-badge-inactive hover:bg-white'}`}>Race {num}</button>))}</div></div>
                    <div className="px-6 mt-4 animate-enter delay-300"><div className="hero-bento glass-panel p-8 rounded-3xl relative overflow-hidden bg-emerald-900 text-white border-none shadow-2xl group cursor-pointer"><div className="absolute top-0 right-0 w-96 h-96 bg-emerald-500 rounded-full blur-[120px] opacity-20 group-hover:opacity-30 transition-opacity"></div><div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6"><div><div className="flex items-center gap-2 mb-3"><div className="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div><span className="text-[10px] font-bold uppercase tracking-widest text-red-400">Live • Race {activeRaceNum}</span></div><h2 className="text-4xl font-luxury font-bold italic leading-tight">{activeCity.name}<br/>Royal Derby</h2><p className="text-emerald-200/60 text-xs font-medium mt-2 uppercase tracking-wide font-elegant">1600m • Turf • Soft Ground</p></div><div className="text-left md:text-right bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/10"><div className="text-[10px] text-emerald-200/80 uppercase font-bold mb-1 font-luxury">Gates Open In</div><div className="font-mono text-3xl font-bold tabular-nums">02:45</div></div></div></div></div>
                    <div className="px-6 mt-10"><div className="flex justify-between items-end mb-6 animate-enter delay-400"><h3 className="text-lg font-luxury font-bold text-[#022c22]">Runner List ({currentHorses.length})</h3><button className="text-xs font-bold text-emerald-600 uppercase tracking-widest hover:underline">View All</button></div><div className="space-y-4">{currentHorses.map((horse, i) => (<HorseCard key={horse.id} horse={horse} delay={`delay-${400 + (i * 50)}`} onClick={(h) => { if (isLowBalance) { alert("Insufficient funds! Please deposit to continue."); openWallet(); return; } setSelectedHorse(h); setActiveModal('bet'); }} />))}</div></div>
                    <div className="dock-container animate-enter delay-700"><div className="dock-item active" onClick={() => {}} title="Home"><i className="ph-fill ph-house"></i><div className="dock-tooltip">Home</div></div><div className="dock-item" onClick={() => openWallet('balance')} title="Wallet"><i className="ph-bold ph-wallet"></i><div className="dock-tooltip">Wallet</div></div><div className="dock-item" onClick={() => openHistory('history')} title="History"><i className="ph-bold ph-clock-counter-clockwise"></i><div className="dock-tooltip">History</div></div><div className="dock-item danger" onClick={handleLogout} title="Logout"><i className="ph-bold ph-sign-out text-red-500"></i><div className="dock-tooltip">Logout</div></div></div>
                    {activeModal === 'bet' && selectedHorse && <BetSlip horse={selectedHorse} wallet={currentWallet} onClose={() => setActiveModal(null)} onPlaceBet={handlePlaceBet} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(localStorage.getItem('tanala_user_v27') ? JSON.parse(localStorage.getItem('tanala_user_v27')) : null);
            const [menuOpen, setMenuOpen] = useState(false);
            const [showWallet, setShowWallet] = useState(false);
            const [defaultWalletTab, setDefaultWalletTab] = useState('balance');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            
            useEffect(() => {
                const init = async () => { try { const auth = getAuth(); await signInAnonymously(auth); setIsFirebaseReady(true); } catch(e) { console.error("Auth wait error", e); setIsFirebaseReady(true); } };
                init();
            }, []);

            const handleLogin = (userData) => {
                localStorage.setItem('tanala_user_v27', JSON.stringify(userData));
                setUser(userData);
            };
            
            const handleLogout = () => {
                localStorage.removeItem('tanala_user_v27');
                setUser(null);
                setMenuOpen(false);
                setIsAdminMode(false);
            };

            const openWalletWithTab = (tab) => {
                setDefaultWalletTab(tab);
                setShowWallet(true);
                setMenuOpen(false);
            };

            if (!isFirebaseReady) return <div className="fixed inset-0 flex items-center justify-center bg-white"><div className="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="w-full h-full">
                    
                    {!user && !isAdminMode ? (
                        <AuthScreen onLoginSuccess={handleLogin} onAdminAccess={() => {}} />
                    ) : isAdminMode ? (
                        <AdminDashboard onClose={() => setIsAdminMode(false)} onLogout={handleLogout} /> 
                    ) : (
                        <>
                            <MenuDrawer isOpen={menuOpen} onClose={() => setMenuOpen(false)} user={user} onLogout={handleLogout} onViewWallet={() => openWalletWithTab('balance')} onOpenAdmin={() => { setMenuOpen(false); setIsAdminMode(true); }} />
                            {showWallet && <WalletView user={user} onClose={() => setShowWallet(false)} defaultTab={defaultWalletTab} />}
                            {isAdminMode && <AdminDashboard onClose={() => setIsAdminMode(false)} onLogout={handleLogout} />}
                            <Dashboard user={user} wallet={user.balance} handleLogout={handleLogout} toggleMenu={() => setMenuOpen(true)} openWallet={() => openWalletWithTab('balance')} openHistory={() => openWalletWithTab('history')} />
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
